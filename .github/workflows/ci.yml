name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes solely from package.json `packageManager`
      # (pnpm@11.7.0) — declaring it here too makes action-setup fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # types ship in the published @deepseek-ai/* packages (pinned 0.1.7-rc.2
      # in the root devDependencies), so typecheck runs on CI since the
      # tsconfig-paths -> local-dsh-worktree anchoring was retired.
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
