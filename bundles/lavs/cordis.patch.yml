# The LAVS bundle: one host adapter plus two browser tabs, riding after the
# web-app bundle layer. Bundle discovery is PROJECT-ONLY: each session sees
# the `.lavs/bundles/` directory of its own workspace — no global roots.

- insert:
    - id: lavs-host
      name: dsh-plugin-lavs-host

    - id: ui-lavs
      name: dsh-plugin-ui-lavs

    - id: ui-tasks
      name: dsh-plugin-ui-tasks
